name: Render production smoke
on:
  push:
    branches:
      [feat/phase2-conversational-modeling, eval/pr22-final-live-acceptance]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke-render.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-production-smoke
          path: test-results/render-smoke/
          retention-days: 14
