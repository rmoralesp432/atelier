name: Render production smoke
on:
  push:
    branches: [eval/iphone-release-evidence]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/iphone-release-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-production-smoke
          path: test-results/
          retention-days: 14
